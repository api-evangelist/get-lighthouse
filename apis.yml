name: Get Lighthouse
description: >-
  Get Lighthouse (Lighthouse Lessons) is a management-training and leadership-development
  company that helps managers run better one-on-ones and grow their teams. It offers
  bite-sized, actionable online management-training programs, including a 1-on-1 Master Class,
  Managing Up, and the Secret Habits of Senior Leaders, delivered as self-paced solo study
  and structured team training, alongside a widely-read management and leadership blog. Get
  Lighthouse is a content and training provider with no public developer API, SDK, or
  developer portal; this API Evangelist profile captures its web identity and domain-security
  posture. It is a portfolio company of 500 Global.
